#Right-clicking an item onto the same item of another quality makes a quality stack, and picked-up items go into quality stacks you carry.
#Off stops both; quality stacks that already exist can still be emptied and filled by hand, so nothing is trapped.
qualityStacks = true
#Picking up an item that differs only in quality from a stack in your inventory makes a quality stack of the two, when the item has no stack of its own quality with room.
#Never touches the item in your hand or offhand. Needs qualityStacks on.
createQualityStacksOnPickup = true
